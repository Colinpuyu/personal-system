<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}上传文档 - {{ project.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('company_projects.company_list') }}">公司列表</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('company_projects.company_detail', company_id=company.id) }}">{{ company.name }}</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('company_projects.project_detail', company_id=company.id, project_id=project.id) }}">{{ project.name }}</a></li>
                    <li class="breadcrumb-item active">上传文档</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="bi bi-upload"></i> 上传文档
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                <i class="bi bi-file-text"></i> 文档标题 <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="document_type" class="form-label">
                                <i class="bi bi-tag"></i> 文档类型
                            </label>
                            <select class="form-select" id="document_type" name="document_type">
                                <option value="需求文档">需求文档</option>
                                <option value="技术文档">技术文档</option>
                                <option value="设计文档">设计文档</option>
                                <option value="测试文档">测试文档</option>
                                <option value="项目文档">项目文档</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="file" class="form-label">
                                <i class="bi bi-file-earmark"></i> 选择文件
                            </label>
                            <input type="file" class="form-control" id="file" name="file">
                            <div class="form-text">支持上传各种格式的文件，如果不选择文件将创建纯文本文档</div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('company_projects.project_detail', company_id=company.id, project_id=project.id) }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> 返回
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-upload"></i> 上传文档
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
