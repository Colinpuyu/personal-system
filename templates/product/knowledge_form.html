{% extends "base.html" %}

{% block title %}{% if knowledge %}编辑知识库{% else %}新建知识库{% endif %} - 产品经理空间{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    {% if knowledge %}
                        <i class="bi bi-pencil"></i> 编辑知识库
                    {% else %}
                        <i class="bi bi-plus-circle"></i> 新建知识库
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" id="knowledgeForm" action="{% if knowledge %}{{ url_for('product_space.knowledge_edit', id=knowledge.id) }}{% else %}{{ url_for('product_space.knowledge_new') }}{% endif %}">
                    <div class="mb-3">
                        <label for="title" class="form-label">标题 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ knowledge.title if knowledge else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label">分类 <span class="text-danger">*</span></label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="">请选择分类</option>
                            <option value="产品规划" {% if knowledge and knowledge.category == '产品规划' %}selected{% endif %}>产品规划</option>
                            <option value="需求分析" {% if knowledge and knowledge.category == '需求分析' %}selected{% endif %}>需求分析</option>
                            <option value="用户研究" {% if knowledge and knowledge.category == '用户研究' %}selected{% endif %}>用户研究</option>
                            <option value="竞品分析" {% if knowledge and knowledge.category == '竞品分析' %}selected{% endif %}>竞品分析</option>
                            <option value="其他" {% if knowledge and knowledge.category == '其他' %}selected{% endif %}>其他</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tags" class="form-label">标签</label>
                        <input type="text" class="form-control" id="tags" name="tags" 
                               value="{{ knowledge.tags if knowledge else '' }}" 
                               placeholder="用逗号分隔多个标签，如：产品设计,用户体验,移动端">
                        <div class="form-text">用逗号分隔多个标签</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="content" class="form-label">内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="10" required>{{ knowledge.content if knowledge else '' }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notes" class="form-label">备注</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3">{{ knowledge.notes if knowledge else '' }}</textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('product_space.knowledge_list') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回列表
                        </a>
                        <div>
                            <button type="button" class="btn btn-outline-primary me-2" onclick="previewContent()">
                                <i class="bi bi-eye"></i> 预览
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> {% if knowledge %}保存修改{% else %}创建知识库{% endif %}
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 预览模态框 -->
        <div class="modal fade" id="previewModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">内容预览</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="previewContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function previewContent() {
    const title = document.getElementById('title').value;
    const category = document.getElementById('category').value;
    const tags = document.getElementById('tags').value;
    const content = document.getElementById('content').value;
    
    if (!title || !category || !content) {
        alert('请填写必填字段后再预览');
        return;
    }
    
    let previewHtml = `
        <div class="card">
            <div class="card-header">
                <h5>${title}</h5>
                <span class="badge bg-secondary">${category}</span>
                ${tags ? tags.split(',').map(tag => `<span class="badge bg-light text-dark">${tag.trim()}</span>`).join('') : ''}
            </div>
            <div class="card-body">
                ${content.replace(/\n/g, '<br>')}
            </div>
        </div>
    `;
    
    document.getElementById('previewContent').innerHTML = previewHtml;
    
    const modal = new bootstrap.Modal(document.getElementById('previewModal'));
    modal.show();
}

// 自动保存草稿
let autoSaveTimer;
document.getElementById('knowledgeForm').addEventListener('input', function() {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(function() {
        saveDraft();
    }, 3000); // 3秒后自动保存
});

function saveDraft() {
    const formData = new FormData(document.getElementById('knowledgeForm'));
    const data = Object.fromEntries(formData);
    
    localStorage.setItem('knowledge_draft', JSON.stringify(data));
    console.log('草稿已保存');
}

// 页面加载时恢复草稿
window.addEventListener('load', function() {
    const draft = localStorage.getItem('knowledge_draft');
    if (draft && !document.getElementById('title').value) {
        if (confirm('检测到未提交的草稿，是否恢复？')) {
            const data = JSON.parse(draft);
            document.getElementById('title').value = data.title || '';
            document.getElementById('category').value = data.category || '';
            document.getElementById('tags').value = data.tags || '';
            document.getElementById('content').value = data.content || '';
            document.getElementById('notes').value = data.notes || '';
        }
    }
});

// 提交成功后清除草稿
document.getElementById('knowledgeForm').addEventListener('submit', function() {
    localStorage.removeItem('knowledge_draft');
});
</script>
{% endblock %}
